<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georcy Perez - Certifications</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
 
    <div class="pill-nav">
        <div class="nav-content">
            <div class="logo-area">
                <div class="profile-logo">G</div>
                <span class="logo-text">Georcy Nilo Perez</span>
            </div>
            <button class="hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="techstack.html">Tech Stack</a></li>
                <li><a href="certifications.html">Certifications</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
 
    <div class="certificates-section">
        <h2 class="certificates-title">My Certifications</h2>
 
        <div class="certificates-grid">
 
             <div class="cert-card">
                <img src="Images/certifications/msword.png" alt="MS Word 2019"
                    onclick="openLightbox('Images/certifications/msword.png', 'MS Word 2019')">
                <a href="https://www.certiport.com/portal/pages/credentialverification.aspx?certId=67890" target="_blank" class="cert-label">MS Word 2019</a>
            </div>
            
            <div class="cert-card">
                <img src="Images/certifications/powerpoint.png" alt="MS PowerPoint"
                    onclick="openLightbox('Images/certifications/powerpoint.png', 'MS PowerPoint')">
                <a href="https://www.certiport.com/portal/pages/credentialverification.aspx?certId=12345" target="_blank" class="cert-label">MS PowerPoint</a>
            </div>
 
            <div class="cert-card">
                <img src="Images/certifications/ccert.png" alt="C Essentials 1"
                    onclick="openLightbox('Images/certifications/ccert.png', 'C Essentials 1')">
                <a href="https://www.credly.com/badges/4672942f-0455-45e9-8615-e86af91198e0/public_url" target="_blank" class="cert-label">C Essentials 1</a>
            </div>

            <div class="cert-card">
                <img src="Images/certifications/networking.png" alt="Networking Basics"
                    onclick="openLightbox('Images/certifications/networking.png', 'Networking Basics')">
                <a href="https://www.credly.com/badges/068221e6-2d07-49b4-8735-63fcced14ea5/public_url" target="_blank" class="cert-label">Networking Basics</a>
            </div>
 
            <div class="cert-card">
                <img src="Images/certifications/python.png" alt="Python Essentials 1"
                    onclick="openLightbox('Images/certifications/python.png', 'Python Essentials 1')">
                <a href="https://www.credly.com/badges/f8eff5a8-09a7-4518-a608-2786466bef40/public_url" target="_blank" class="cert-label">Python Essentials 1</a>
            </div>
 
            <div class="cert-card">
                <img src="Images/certifications/dbmscert.png" alt="Database Management"
                    onclick="openLightbox('Images/certifications/dbmscert.png', 'Database Management')">
                <a href="https://learn.saylor.org/admin/tool/certificate/index.php?code=8903173363GN" target="_blank" class="cert-label">Database Management</a>
            </div>
 
            <div class="cert-card">
                <img src="Images/certifications/secert.png" alt="Software Engineer"
                    onclick="openLightbox('Images/certifications/secert.png', 'Software Engineer')">
                <a href="https://learn.saylor.org/admin/tool/certificate/index.php?code=6067369659GN" target="_blank" class="cert-label">Software Engineer</a>
            </div>
 
        </div>
    </div>
 
    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img src="" alt="" id="lightbox-img">
            <p id="lightbox-title"></p>
        </div>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('open');
        }
 
        function openLightbox(src, title) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-title').textContent = title;
            document.getElementById('lightbox').classList.add('active');
 
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'info',
                title: `Viewing: ${title}`,
                showConfirmButton: false,
                timer: 1500,
                timerProgressBar: true,
            });
        }
 
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
 
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
 
</body>
</html>
