<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georcy Perez - Certificates</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <div class="pill-nav">
        <div class="nav-content">
            <div class="logo-area">
                <div class="profile-logo">G</div>
                <span class="logo-text">Georcy Nilo Perez</span>
            </div>
            <button class="hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="techstack.html">Tech Stack</a></li>
                <li><a href="certificates.html">Certificate</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>

    <div class="certificates-section">
        <h2 class="certificates-title">My Certificates</h2>

        <div class="certificates-grid">

            <!-- C Essentials 1 -->
            <div class="cert-card">
                <img src="Images/certifications/ccert.png" alt="C Essentials 1"
                    onclick="openLightbox('Images/certifications/ccert.png', 'C Essentials 1')">
                <a href="https://www.credly.com/badges/4672942f-0455-45e9-8615-e86af91198e0/public_url" target="_blank" class="cert-label">C Essentials 1</a>
            </div>

            <!-- MS PowerPoint -->
            <div class="cert-card">
                <img src="Images/certifications/powerpoint.png" alt="MS PowerPoint"
                    onclick="openLightbox('Images/certifications/powerpoint.png', 'MS PowerPoint')">
                <a href="https://www.credly.com/badges/7a89542d-ac61-48c9-b618-9a389b446ee7/public_url" target="_blank" class="cert-label">MS PowerPoint</a>
            </div>

            <!-- MS Word 2019 -->
            <div class="cert-card">
                <img src="Images/certifications/msword.png" alt="MS Word 2019"
                    onclick="openLightbox('Images/certifications/msword.png', 'MS Word 2019')">
                <a href="https://www.credly.com/badges/3436ec94-fbcb-4f31-8081-61c396c62bea/public_url" target="_blank" class="cert-label">MS Word 2019</a>
            </div>

            <!-- Networking Basics -->
            <div class="cert-card">
                <img src="Images/certifications/networking.png" alt="Networking Basics"
                    onclick="openLightbox('Images/certifications/networking.png', 'Networking Basics')">
                <a href="https://www.credly.com/badges/068221e6-2d07-49b4-8735-63fcced14ea5/public_url" target="_blank" class="cert-label">Networking Basics</a>
            </div>

            <!-- Python Essentials 1 -->
            <div class="cert-card">
                <img src="Images/certifications/python.png" alt="Python Essentials 1"
                    onclick="openLightbox('Images/certifications/python.png', 'Python Essentials 1')">
                <a href="https://www.credly.com/badges/f8eff5a8-09a7-4518-a608-2786466bef40/public_url" target="_blank" class="cert-label">Python Essentials 1</a>
            </div>

        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img src="" alt="" id="lightbox-img">
            <p id="lightbox-title"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Toggle mobile nav
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('open');
        }

        // Open lightbox with SweetAlert2 toast notification
        function openLightbox(src, title) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-title').textContent = title;
            document.getElementById('lightbox').classList.add('active');

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'info',
                title: `Viewing: ${title}`,
                showConfirmButton: false,
                timer: 1500,
                timerProgressBar: true,
            });
        }

        // Close lightbox
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        // Close with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

</body>
</html>
